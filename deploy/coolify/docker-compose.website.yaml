# Coolify: marketing site (@troott/website) — troott.com
# Build Pack = Docker Compose. Docker Compose Location = this file.
#
# Resource env:
#   GHCR_ORG = GitHub org/user (lowercase)
#   IMAGE_TAG = development | staging | production
#
# CI image: ghcr.io/${GHCR_ORG}/troott-website:${IMAGE_TAG}
#
# unauthorized / manifest unknown -> see docs/coolify-monorepo-setup.md
services:
  website:
    image: ghcr.io/${GHCR_ORG?GHCR_ORG unset}/troott-website:${IMAGE_TAG?IMAGE_TAG unset}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
