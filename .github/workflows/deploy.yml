# Deploy: build Docker images in GitHub Actions, push to GHCR (dual tags), trigger Coolify.
#
# Coolify — two options:
#
# (1) Docker Image only: ghcr.io/<lowercase-org>/troott-<api|web|website>:<env>
#
# (2) Docker Compose + pre-built image (recommended for git-connected apps):
#     deploy/coolify/docker-compose.api.yaml | .web.yaml | .website.yaml
#     Build Pack = Docker Compose; "Docker Compose Location" = file above.
#     Resource env: GHCR_ORG (lowercase GitHub org/user), IMAGE_TAG = development | staging | production
#     Compose pulls image only (no build: on the server).
#
# Floating tag = environment; CI also pushes immutable :<env>-<shortsha>.
# Private GHCR: registry credentials in Coolify (ghcr.io + read-only PAT with read:packages).
#
# GitHub: Actions "Read and write" (packages: write) or PAT with write:packages.
# Secrets: COOLIFY_API_TOKEN, COOLIFY_APP_UUID_* ; optional TURBO_TOKEN.
# Variables: COOLIFY_API_URL, TURBO_TEAM, per-env API_URL / WEB_URL / WEBSITE_URL.
#
# GitHub Environments (staging, production): build/deploy jobs attach `environment:` for
# env-scoped vars (e.g. API_URL). development branch deploys use repository-level vars.
# Manual workflow_dispatch targets staging or production only.
#
# Spec: specs/platform/feature/feat-0001/TECH.md

name: Deploy

on:
    push:
        branches:
            - development
            - staging
            - master
        paths-ignore:
            - '**.md'
            - 'docs/**'
            - 'specs/**'
    workflow_dispatch:
        inputs:
            environment:
                description: Environment to deploy to
                required: true
                type: choice
                options:
                    - staging
                    - production
            apps:
                description: 'Apps (comma-separated: api,web,website)'
                required: false
                default: api,web,website

permissions:
    contents: read
    packages: write

env:
    NODE_VERSION: '22'
    PNPM_VERSION: '10.33.0'
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
    group: deploy-${{ github.event.inputs.environment || (github.ref_name == 'master' && 'production' || (github.ref_name == 'staging' && 'staging' || 'development')) }}
    cancel-in-progress: false

jobs:
    determine-environment:
        name: Determine environment
        runs-on: ubuntu-latest
        outputs:
            env: ${{ steps.set-env.outputs.env }}
            protected_environment: ${{ steps.set-env.outputs.protected_environment }}
        steps:
            - name: Set environment
              id: set-env
              run: |
                  if [ -n "${{ github.event.inputs.environment }}" ]; then
                    echo "env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
                    echo "protected_environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
                  elif [ "${{ github.ref_name }}" = "master" ]; then
                    echo "env=production" >> "$GITHUB_OUTPUT"
                    echo "protected_environment=production" >> "$GITHUB_OUTPUT"
                  elif [ "${{ github.ref_name }}" = "staging" ]; then
                    echo "env=staging" >> "$GITHUB_OUTPUT"
                    echo "protected_environment=staging" >> "$GITHUB_OUTPUT"
                  else
                    echo "env=development" >> "$GITHUB_OUTPUT"
                    echo "protected_environment=" >> "$GITHUB_OUTPUT"
                  fi

    detect-changes:
        name: Detect changes
        runs-on: ubuntu-latest
        outputs:
            api: ${{ steps.changes.outputs.api }}
            web: ${{ steps.changes.outputs.web }}
            website: ${{ steps.changes.outputs.website }}
        steps:
            - name: Checkout
              if: github.event_name == 'push'
              uses: actions/checkout@v4

            - name: Detect file changes
              if: github.event_name == 'push'
              id: filter
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      shared:
                        - 'configs/**'
                        - 'deploy/coolify/**'
                        - 'pnpm-lock.yaml'
                        - 'pnpm-workspace.yaml'
                        - 'turbo.json'
                        - 'package.json'
                        - '.github/workflows/deploy.yml'
                      api:
                        - 'apps/api/**'
                      web:
                        - 'apps/web/**'
                      website:
                        - 'apps/website/**'

            - name: Set outputs
              id: changes
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "api=true" >> "$GITHUB_OUTPUT"
                    echo "web=true" >> "$GITHUB_OUTPUT"
                    echo "website=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "api=${{ steps.filter.outputs.api == 'true' || steps.filter.outputs.shared == 'true' }}" >> "$GITHUB_OUTPUT"
                    echo "web=${{ steps.filter.outputs.web == 'true' || steps.filter.outputs.shared == 'true' }}" >> "$GITHUB_OUTPUT"
                    echo "website=${{ steps.filter.outputs.website == 'true' || steps.filter.outputs.shared == 'true' }}" >> "$GITHUB_OUTPUT"
                  fi

    build-api:
        name: Build and push (troott-api)
        runs-on: ubuntu-latest
        needs: [determine-environment, detect-changes]
        if: needs.detect-changes.outputs.api == 'true'
        timeout-minutes: 30
        environment: ${{ needs.determine-environment.outputs.protected_environment || null }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image tags
              id: meta
              run: |
                  OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
                  SHA=$(echo '${{ github.sha }}' | cut -c1-7)
                  echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
                  echo "sha=$SHA" >> "$GITHUB_OUTPUT"
                  echo "float=${{ needs.determine-environment.outputs.env }}" >> "$GITHUB_OUTPUT"

            - name: Build and push
              env:
                  DOCKER_BUILDKIT: 1
              run: |
                  OWNER="${{ steps.meta.outputs.owner }}"
                  FLOAT="${{ steps.meta.outputs.float }}"
                  SHA="${{ steps.meta.outputs.sha }}"
                  docker buildx build \
                    --push \
                    --cache-from type=gha,scope=troott-api \
                    --cache-to type=gha,mode=max,scope=troott-api \
                    -f apps/api/Dockerfile \
                    -t "ghcr.io/${OWNER}/troott-api:${FLOAT}" \
                    -t "ghcr.io/${OWNER}/troott-api:${FLOAT}-${SHA}" \
                    .

    build-web:
        name: Build and push (troott-web)
        runs-on: ubuntu-latest
        needs: [determine-environment, detect-changes]
        if: needs.detect-changes.outputs.web == 'true'
        timeout-minutes: 30
        environment: ${{ needs.determine-environment.outputs.protected_environment || null }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image tags
              id: meta
              run: |
                  OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
                  SHA=$(echo '${{ github.sha }}' | cut -c1-7)
                  echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
                  echo "sha=$SHA" >> "$GITHUB_OUTPUT"
                  echo "float=${{ needs.determine-environment.outputs.env }}" >> "$GITHUB_OUTPUT"

            - name: Build and push
              env:
                  DOCKER_BUILDKIT: 1
                  VITE_APP_API_URL: ${{ vars.API_URL }}
                  VITE_APP_ENVIRONMENT: prod
                  VITE_TROOTT_PLAY_STORE_URL: ${{ vars.TROOTT_PLAY_STORE_URL || 'https://play.google.com/store/apps/details?id=com.troott.app' }}
                  VITE_TROOTT_APP_STORE_URL: ${{ vars.TROOTT_APP_STORE_URL || 'https://apps.apple.com/ng/app/troott/id1234567890' }}
                  VITE_TROOTT_WEB_APP_URL: ${{ vars.WEB_APP_URL || vars.API_URL }}
              run: |
                  OWNER="${{ steps.meta.outputs.owner }}"
                  FLOAT="${{ steps.meta.outputs.float }}"
                  SHA="${{ steps.meta.outputs.sha }}"
                  docker buildx build \
                    --push \
                    --cache-from type=gha,scope=troott-web \
                    --cache-to type=gha,mode=max,scope=troott-web \
                    --build-arg VITE_APP_API_URL \
                    --build-arg VITE_APP_ENVIRONMENT \
                    --build-arg VITE_TROOTT_PLAY_STORE_URL \
                    --build-arg VITE_TROOTT_APP_STORE_URL \
                    --build-arg VITE_TROOTT_WEB_APP_URL \
                    -f apps/web/Dockerfile \
                    -t "ghcr.io/${OWNER}/troott-web:${FLOAT}" \
                    -t "ghcr.io/${OWNER}/troott-web:${FLOAT}-${SHA}" \
                    .

    build-website:
        name: Build and push (troott-website)
        runs-on: ubuntu-latest
        needs: [determine-environment, detect-changes]
        if: needs.detect-changes.outputs.website == 'true'
        timeout-minutes: 30
        environment: ${{ needs.determine-environment.outputs.protected_environment || null }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image tags
              id: meta
              run: |
                  OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
                  SHA=$(echo '${{ github.sha }}' | cut -c1-7)
                  echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
                  echo "sha=$SHA" >> "$GITHUB_OUTPUT"
                  echo "float=${{ needs.determine-environment.outputs.env }}" >> "$GITHUB_OUTPUT"

            - name: Build and push
              env:
                  DOCKER_BUILDKIT: 1
                  NEXT_PUBLIC_APP_API_URL: ${{ vars.API_URL }}
                  NEXT_PUBLIC_APP_ENVIRONMENT: production
              run: |
                  OWNER="${{ steps.meta.outputs.owner }}"
                  FLOAT="${{ steps.meta.outputs.float }}"
                  SHA="${{ steps.meta.outputs.sha }}"
                  docker buildx build \
                    --push \
                    --cache-from type=gha,scope=troott-website \
                    --cache-to type=gha,mode=max,scope=troott-website \
                    --build-arg NEXT_PUBLIC_APP_API_URL \
                    --build-arg NEXT_PUBLIC_APP_ENVIRONMENT \
                    -f apps/website/Dockerfile \
                    -t "ghcr.io/${OWNER}/troott-website:${FLOAT}" \
                    -t "ghcr.io/${OWNER}/troott-website:${FLOAT}-${SHA}" \
                    .

    deploy-api:
        name: Deploy API
        runs-on: ubuntu-latest
        needs: [build-api, detect-changes, determine-environment]
        if: needs.detect-changes.outputs.api == 'true'
        environment: ${{ needs.determine-environment.outputs.protected_environment || null }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Deploy to Coolify
              uses: ./.github/actions/coolify-deploy
              with:
                  coolify-api-url: ${{ vars.COOLIFY_API_URL }}
                  coolify-api-token: ${{ secrets.COOLIFY_API_TOKEN }}
                  app-uuid: ${{ secrets.COOLIFY_APP_UUID_API }}
                  app-label: api.troott.com

    deploy-web:
        name: Deploy studio web
        runs-on: ubuntu-latest
        needs: [build-web, detect-changes, determine-environment]
        if: needs.detect-changes.outputs.web == 'true'
        environment: ${{ needs.determine-environment.outputs.protected_environment || null }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Deploy to Coolify
              uses: ./.github/actions/coolify-deploy
              with:
                  coolify-api-url: ${{ vars.COOLIFY_API_URL }}
                  coolify-api-token: ${{ secrets.COOLIFY_API_TOKEN }}
                  app-uuid: ${{ secrets.COOLIFY_APP_UUID_WEB }}
                  app-label: app.troott.com

    deploy-website:
        name: Deploy marketing website
        runs-on: ubuntu-latest
        needs: [build-website, detect-changes, determine-environment]
        if: needs.detect-changes.outputs.website == 'true'
        environment: ${{ needs.determine-environment.outputs.protected_environment || null }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Deploy to Coolify
              uses: ./.github/actions/coolify-deploy
              with:
                  coolify-api-url: ${{ vars.COOLIFY_API_URL }}
                  coolify-api-token: ${{ secrets.COOLIFY_API_TOKEN }}
                  app-uuid: ${{ secrets.COOLIFY_APP_UUID_WEBSITE }}
                  app-label: troott.com
