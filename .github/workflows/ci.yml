# feat-0001 — CI: lint, typecheck, test, build, expo-doctor
#
# GitHub Environments (staging, production): jobs targeting master or staging attach
# `environment:` so env-scoped secrets/vars resolve (same pattern as deploy.yml).
# development branch / PRs use repository-level secrets and variables only.
#
# Spec: specs/platform/feature/feat-0001/TECH.md

name: CI

on:
    push:
        branches:
            - master
            - staging
            - development
        paths-ignore:
            - '**.md'
            - 'docs/**'
            - 'specs/**'
    pull_request:
        branches:
            - master
            - staging
            - development
        paths-ignore:
            - '**.md'
            - 'docs/**'
            - 'specs/**'

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: '22'
    PNPM_VERSION: '10.33.0'
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
    determine-environment:
        name: Determine environment
        runs-on: ubuntu-latest
        outputs:
            env: ${{ steps.set-env.outputs.env }}
            protected_environment: ${{ steps.set-env.outputs.protected_environment }}
        steps:
            - name: Set environment from branch
              id: set-env
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    BRANCH="${{ github.base_ref }}"
                  else
                    BRANCH="${{ github.ref_name }}"
                  fi
                  if [ "$BRANCH" = "master" ]; then
                    echo "env=production" >> "$GITHUB_OUTPUT"
                    echo "protected_environment=production" >> "$GITHUB_OUTPUT"
                  elif [ "$BRANCH" = "staging" ]; then
                    echo "env=staging" >> "$GITHUB_OUTPUT"
                    echo "protected_environment=staging" >> "$GITHUB_OUTPUT"
                  else
                    echo "env=development" >> "$GITHUB_OUTPUT"
                    echo "protected_environment=" >> "$GITHUB_OUTPUT"
                  fi

    validate:
        name: Validate
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: [determine-environment]
        environment: ${{ needs.determine-environment.outputs.protected_environment || null }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 2

            - name: Setup monorepo
              uses: ./.github/actions/setup-monorepo

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck:workspace

            - name: Typecheck API
              run: pnpm typecheck:api

            - name: Format check
              run: pnpm format:check
              continue-on-error: true

    test:
        name: Test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [determine-environment, validate]
        environment: ${{ needs.determine-environment.outputs.protected_environment || null }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup monorepo
              uses: ./.github/actions/setup-monorepo

            - name: Run tests
              run: pnpm test:ci

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 25
        needs: [determine-environment, validate]
        environment: ${{ needs.determine-environment.outputs.protected_environment || null }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup monorepo
              uses: ./.github/actions/setup-monorepo

            - name: Build deployable apps
              env:
                  VITE_APP_API_URL: ${{ vars.API_URL || 'http://localhost:5025' }}
                  VITE_APP_ENVIRONMENT: development
                  VITE_TROOTT_PLAY_STORE_URL: ${{ vars.TROOTT_PLAY_STORE_URL || 'https://play.google.com/store/apps/details?id=com.troott.app' }}
                  VITE_TROOTT_APP_STORE_URL: ${{ vars.TROOTT_APP_STORE_URL || 'https://apps.apple.com/ng/app/troott/id1234567890' }}
                  VITE_TROOTT_WEB_APP_URL: ${{ vars.WEB_APP_URL || vars.APP_URL || 'https://app.troott.com' }}
              run: pnpm build:ci

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: troott-build-artifacts
                  path: |
                      apps/api/dist
                      apps/web/dist
                      apps/website/.next
                  retention-days: 1
                  if-no-files-found: error

    mobile:
        name: Expo doctor
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [determine-environment, validate]
        environment: ${{ needs.determine-environment.outputs.protected_environment || null }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup monorepo
              uses: ./.github/actions/setup-monorepo

            - name: Expo doctor
              run: pnpm dlx expo-doctor@latest
              working-directory: apps/mobile

    security:
        name: Security
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [determine-environment]
        environment: ${{ needs.determine-environment.outputs.protected_environment || null }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup monorepo
              uses: ./.github/actions/setup-monorepo

            - name: pnpm audit
              run: pnpm audit --prod || true

            - name: TruffleHog secret scan (pull request)
              if: github.event_name == 'pull_request'
              uses: trufflesecurity/trufflehog@main
              with:
                  path: ./
                  base: ${{ github.event.pull_request.base.sha }}
                  head: ${{ github.event.pull_request.head.sha }}
              continue-on-error: true

            - name: TruffleHog secret scan (push)
              if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
              uses: trufflesecurity/trufflehog@main
              with:
                  path: ./
                  base: ${{ github.event.before }}
                  head: ${{ github.sha }}
              continue-on-error: true

            - name: Security summary
              if: always()
              run: echo "Security checks completed (audit and TruffleHog are warn-only)."

    ci-success:
        name: CI success
        runs-on: ubuntu-latest
        needs: [validate, test, build, mobile]
        if: always()

        steps:
            - name: Check required jobs
              run: |
                  if [ "${{ needs.validate.result }}" != "success" ] || \
                     [ "${{ needs.test.result }}" != "success" ] || \
                     [ "${{ needs.build.result }}" != "success" ] || \
                     [ "${{ needs.mobile.result }}" != "success" ]; then
                    echo "CI pipeline failed"
                    exit 1
                  fi
                  echo "CI pipeline passed"
